name: Release new version
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm ci
      - name: Validate release tag
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Release tag mismatch: expected ${expected_tag} from package.json, got ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - name: Build and verify
        run: npm run build && npm run verify
      - name: Create or update release and upload script
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
            gh release upload "${GITHUB_REF_NAME}" "dist/npu.user.js" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "dist/npu.user.js" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --verify-tag --generate-notes --draft=false
          fi
